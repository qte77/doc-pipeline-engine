[project]
name = "doc-pipeline-engine"
version = "0.1.0"
description = "Modular document processing engine with contract-gated pipeline stages"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "pydantic>=2.7",
]

[project.optional-dependencies]
# Install with: uv sync --extra extract
# Kreuzberg covers PDF/Office/images/email/text via Tesseract+pypdfium2.
# MIT (≤ v4.7.4) — pinned to the last MIT release. Upstream relicensed to
# Elastic License 2.0 starting at v4.8.0 (2026-04-08); see ADR-0005 and issue #76.
# For the ELv2 line, install the [kreuzberg-elv2] extra instead.
extract = [
  "kreuzberg>=2.0,<4.8",
]
# Install with: uv sync --extra kreuzberg-elv2
# Latest Kreuzberg under Elastic License 2.0 (source-available, not OSI-OSS).
# ELv2 restricts offering the software as a managed/hosted service to third
# parties. Use only if your deployment is comfortable with that constraint.
# See ADR-0005.
kreuzberg-elv2 = [
  "kreuzberg>=4.8",
]
# Install with: uv sync --extra render
# Shared rendering: Markdown → HTML → PDF (WeasyPrint), Markdown → DOCX (python-docx).
# All BSD-3 / MIT, pure-Python, no JVM, no GPL.
render = [
  "markdown>=3.5",
  "python-docx>=1.1",
  "weasyprint>=62",
]
# Install with: uv sync --extra anthropic_sdk
# anthropic_sdk pipeline leg: Anthropic Python SDK for normalize / analyze /
# render / eval. Marked optional because anthropic calls anthropic.com (cloud
# locality); §0.5 `local-only` deployment profile must be able to skip it.
# License is Apache-2.0 (permissive); ANTHROPIC_API_KEY is checked at call time.
# The SDK accepts `base_url` so the leg can also point at Bedrock, Vertex, or
# a self-hosted Anthropic-compatible endpoint.
anthropic_sdk = [
  "anthropic>=0.40",
]
# Install with: uv sync --extra local
# local pipeline leg: deterministic Python tools for normalize / analyze /
# render. No LLM, no cloud calls. Marked optional for footprint (spaCy +
# transitive deps ~150 MB). spaCy needs `make install_v2_nlp` for
# en_core_web_sm.
# Note: spaCy currently lacks Python 3.14 wheels. Use `--extra local-render`
# (jinja2 only) on 3.14 environments; full `--extra local` requires
# Python ≤ 3.13.
local = [
  "jinja2>=3.1",
  "spacy>=3.7",
]
# Subset of local for environments where spaCy can't install (e.g. Python
# 3.14). Enables local_render and local_normalize / local_eval; local_analyze
# runs without entities.
local-render = [
  "jinja2>=3.1",
]
# Install with: uv sync --extra local-eval
# DeepEval faithfulness probe for the local leg (local heuristic by default).
local-eval = [
  "deepeval>=0.20",
]
# Deprecated aliases (will be removed in §0.5.0). Point at the renamed extras
# so existing devcontainer scripts and CI configs keep working for one cycle.
v1 = [
  "doc-pipeline-engine[anthropic_sdk]",
]
v2 = [
  "doc-pipeline-engine[local]",
]
v2-render = [
  "doc-pipeline-engine[local-render]",
]
v2-eval = [
  "doc-pipeline-engine[local-eval]",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "scriv[toml]>=1.8",
]
# Install with: uv sync --only-group docs
# Used by .github/workflows/generate-deploy-mkdocs-ghpages.yaml to build and
# deploy the API docs site. Not required for runtime or tests.
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "mkdocs-autorefs>=1.0",
]

[project.scripts]
doc-pipeline = "doc_pipeline_engine.stream:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Reason: `extract` (kreuzberg<4.8, MIT) and `kreuzberg-elv2` (kreuzberg>=4.8,
# ELv2) are a deliberate either/or licence boundary (ADR-0005). Declaring them
# as conflicting lets uv resolve/lock the project instead of failing
# "unsatisfiable" on every non-frozen `uv sync` / `make install`.
conflicts = [
  [{ extra = "extract" }, { extra = "kreuzberg-elv2" }],
]

[tool.hatch.build.targets.wheel]
packages = ["src/doc_pipeline_engine"]

# Per-PR changelog fragments collected into CHANGELOG.md at release. See ADR-0012.
[tool.scriv]
format = "md"
fragment_directory = "changelog.d"
categories = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"]
md_header_level = "2"
entry_title_template = "[{{ version }}] - {{ date.strftime('%Y-%m-%d') }}"
md_html_anchors = false  # avoid scriv's <a id=…> anchor (markdownlint MD033)

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# D rules enforce docstring presence so mkdocstrings has something to render.
# Narrow set: only require module / class / function / package docstrings.
# Google convention; private (_-prefixed) names skipped automatically.
# S = bandit-equivalent security checks. C90 = McCabe complexity (≤ 10).
select = ["D100", "D101", "D103", "D104", "S", "C90", "E", "F", "I", "W", "UP", "PGH", "B", "SIM", "RUF", "N", "PT", "TCH", "TRY"]

ignore = [
    "TRY003",  # long messages in defensive raises are clearer inline than in exception subclasses
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Tests, scripts, and helpers are internal — docstrings aren't required.
# S101 (assert) is fine in tests; tests are the place to use it.
"tests/**" = ["D", "S101"]
"scripts/**" = ["D"]
"src/doc_pipeline_engine/stages/_*.py" = ["D"]
"src/doc_pipeline_engine/models/_common.py" = ["D"]
"src/doc_pipeline_engine/models/__main__.py" = ["D"]
