[project]
name = "doc-pipeline-engine"
version = "0.1.0"
description = "Modular document processing engine with contract-gated pipeline stages"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "jsonschema>=4.21",
]

[project.optional-dependencies]
# Install with: uv sync --extra extract
# Kreuzberg covers PDF/Office/images/email/text via Tesseract+pypdfium2.
# MIT, local-only, no cloud.
extract = [
  "kreuzberg>=2.0",
]
# Install with: uv sync --extra render
# Shared rendering: Markdown → HTML → PDF (WeasyPrint), Markdown → DOCX (python-docx).
# All BSD-3 / MIT, pure-Python, no JVM, no GPL.
render = [
  "markdown>=3.5",
  "python-docx>=1.1",
  "weasyprint>=62",
]
# Install with: uv sync --extra v1
# V1 pipeline leg: Claude API for normalize / analyze / render.
# Marked optional because anthropic calls anthropic.com (cloud locality);
# §0.5 `local-only` deployment profile must be able to skip it. License is
# Apache-2.0 (permissive); ANTHROPIC_API_KEY is checked at call time.
v1 = [
  "anthropic>=0.40",
]
# Install with: uv sync --extra v2
# V2 pipeline leg: deterministic Python tools for normalize / analyze / render.
# Marked optional for footprint (spaCy + transitive deps ~150 MB); local-only
# by construction. spaCy needs `make install-models` for en_core_web_sm.
# Note: spaCy currently lacks Python 3.14 wheels. Use `--extra v2-render`
# (jinja2 only) on 3.14 environments; full `--extra v2` requires Python ≤ 3.13.
v2 = [
  "jinja2>=3.1",
  "spacy>=3.7",
]
# Subset of v2 for environments where spaCy can't install (e.g. Python 3.14).
# Enables v2_render and v2_normalize/v2_eval; v2_analyze runs without entities.
v2-render = [
  "jinja2>=3.1",
]
# Install with: uv sync --extra v2-eval
# DeepEval faithfulness probe for V2 leg (local heuristic by default).
# Wired by PR 6 harness; not used by v2_eval directly in v1 of the prototype.
v2-eval = [
  "deepeval>=0.20",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_pipeline_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"
