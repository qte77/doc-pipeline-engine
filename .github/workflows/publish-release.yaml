---
name: publish-release

# Manually publishes a GitHub Release for an existing tag, with notes from the
# CHANGELOG.md `## [version]` block, via the qte77/.github reusable. Decoupled from
# tag-release.yaml so the default flow stays tag-only. Never overwrites a Release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (defaults to the latest v* tag)"
        required: false
        type: string

permissions:
  contents: read  # elevated per-job below

jobs:
  publish:
    uses: qte77/.github/.github/workflows/publish-release.yml@43ad1211e962f82fab823377dcc7272054d8196c  # 2026-11-11
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag }}
