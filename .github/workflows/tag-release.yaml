---
name: tag-release

# Watches main for a pyproject.toml version change (the squash-merge of a
# bump-my-version release PR) and creates the annotated `v$NEW` tag on that main
# commit via the qte77/.github reusable. Idempotent: no-op without a version change,
# aborts (never deletes) when the tag already exists. A new tag is published as a
# GitHub Release in the same run (job `publish`).

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: read  # elevated per-job below

jobs:
  tag:
    uses: qte77/.github/.github/workflows/tag-release.yml@a32769a925e4d056b5d389ad727f7831973f7161  # main 2026-11-12 (qte77/.github#64)
    permissions:
      contents: write
  publish:
    # Publish the Release in the same run: a tag pushed with GITHUB_TOKEN starts no
    # `on: push: tags` workflow. Skipped when this push created no tag.
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: qte77/.github/.github/workflows/publish-release.yml@a32769a925e4d056b5d389ad727f7831973f7161  # main 2026-11-12 (qte77/.github#64)
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.tag }}
