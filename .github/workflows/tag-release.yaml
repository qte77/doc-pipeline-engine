---
name: tag-release

# Watches main for a pyproject.toml version change (the squash-merge of a
# bump-my-version release PR) and creates the annotated `v$NEW` tag on that main
# commit via the qte77/.github reusable. Idempotent: no-op without a version change,
# aborts (never deletes) when the tag already exists.

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: read  # elevated per-job below

jobs:
  tag:
    uses: qte77/.github/.github/workflows/tag-release.yml@86d329865ce47b43b6e745084c92032b41dcab1b  # main 2026-10-24
    permissions:
      contents: write
