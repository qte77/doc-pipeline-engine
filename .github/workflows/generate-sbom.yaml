name: Generate SBOM

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/SBOM/**"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Generate SBOM
        # Pinned to v0.1.0 (NOT latest): v0.1.1 commits the SBOM PR as an unsigned
        # github-actions commit, which the repo's required_signatures ruleset
        # (no bypass actors) rejects — making the auto-PR unmergeable. v0.1.0
        # creates a signed (API) commit. Revert when the action signs again.
        uses: qte77/gha-sbom-action@82becb244dc8ec442a17d5b5e171d0a384909896 # v0.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
