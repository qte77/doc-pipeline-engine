---
name: bump-my-version

# Manual version bump. Thin caller for the qte77/.github reusable: bumps
# pyproject.toml + README badge per [tool.bumpversion], syncs uv.lock, collects
# changelog.d/ fragments via scriv, pushes a GitHub-signed commit to a bump branch,
# and opens a PR. Tagging is deferred to tag-release.yaml (--no-tag) so the tag
# lands on main's squash-merge commit — no tag drift.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Semver part to bump"
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: read  # elevated per-job below

jobs:
  bump:
    uses: qte77/.github/.github/workflows/bump-version.yml@86d329865ce47b43b6e745084c92032b41dcab1b  # main 2026-10-24
    permissions:
      contents: write
      pull-requests: write
    with:
      bump_type: ${{ inputs.bump_type }}
      use_uv: true
      sync_lockfile: true
      collect_scriv: true
      pr_title_template: "chore(release): bump {previous} -> {current}"
